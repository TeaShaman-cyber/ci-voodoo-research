name: CI Voodoo

on:
  pull_request:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      mode:
        description: Artifact mode
        required: true
        type: choice
        options:
          - text
      target_class:
        description: Abstract target class
        required: true
        type: choice
        options:
          - BUG
          - SYSTEM
          - PROCESS
          - VENDOR_ABSTRACT
          - ROLE_ABSTRACT
      intensity:
        description: Public intensity 0-3
        required: true
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      ritual_style:
        description: Ritual style
        required: true
        type: choice
        options:
          - plain-rage
          - folk-curse
          - ci-voodoo
          - cato
      incident_ref:
        description: Opaque sha256 reference only; never paste raw chat text
        required: true
        type: string
      seed:
        description: Optional deterministic seed
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify repository
        run: ./tools/dev/check

  canonical:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify
        run: ./tools/dev/check

      - name: Generate canonical artifact
        env:
          CI_VOODOO_MODE: ${{ inputs.mode }}
          CI_VOODOO_TARGET_CLASS: ${{ inputs.target_class }}
          CI_VOODOO_INTENSITY: ${{ inputs.intensity }}
          CI_VOODOO_RITUAL_STYLE: ${{ inputs.ritual_style }}
          CI_VOODOO_INCIDENT_REF: ${{ inputs.incident_ref }}
          CI_VOODOO_SEED: ${{ inputs.seed }}
          CI_VOODOO_OUT_DIR: artifacts/canonical
          CI_VOODOO_RUNNER_REVISION: ${{ github.sha }}
        run: node src/cli.mjs

      - name: Upload canonical receipt bundle
        uses: actions/upload-artifact@v4
        with:
          name: ci-voodoo-canonical
          path: artifacts/canonical
          if-no-files-found: error

  canonical-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/ci-voodoo')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify
        run: ./tools/dev/check

      - name: Generate canonical artifact from native GitHub request
        env:
          CI_VOODOO_COMMENT_BODY: ${{ github.event.comment.body }}
          CI_VOODOO_OUT_DIR: artifacts/canonical
          CI_VOODOO_RUNNER_REVISION: ${{ github.sha }}
        run: node src/github_comment_cli.mjs

      - name: Upload canonical receipt bundle
        uses: actions/upload-artifact@v4
        with:
          name: ci-voodoo-canonical-${{ github.event.comment.id }}
          path: artifacts/canonical
          if-no-files-found: error
